# Deployment: moodle-deployment
apiVersion: apps/v1
kind: Deployment
metadata:
  name: moodle-deployment
  labels:
    app: moodle-app
spec:
  replicas: 1
  selector:
    matchLabels:
      app: moodle-app
  template:
    metadata:
      labels:
        app: moodle-app
    spec:
      terminationGracePeriodSeconds: 10
      containers:
        - name: moodle
          image: nginx:alpine
          ports:
            - containerPort: 80
          resources:
            requests:
              cpu: "100m"
            limits:
              cpu: "300m"
          volumeMounts:
            - name: html-index
              mountPath: /usr/share/nginx/html/index.html
              subPath: index.html
            - name: html-tugas
              mountPath: /usr/share/nginx/html/tugas.html
              subPath: tugas.html
            - name: css-style
              mountPath: /usr/share/nginx/html/style.css
              subPath: style.css
            - name: nginx-conf
              mountPath: /etc/nginx/conf.d/default.conf
              subPath: default.conf
            - name: nginx-main-conf
              mountPath: /etc/nginx/nginx.conf
              subPath: nginx.conf
          readinessProbe:
            httpGet:
              path: /health
              port: 80
            initialDelaySeconds: 2
            periodSeconds: 2
          livenessProbe:
            httpGet:
              path: /health
              port: 80
            initialDelaySeconds: 5
            periodSeconds: 5
        # Sidecar: Python CPU stress server
        - name: stress-sidecar
          image: python:3.11-alpine
          imagePullPolicy: IfNotPresent
          command: ["python3", "/scripts/stress_server.py"]
          ports:
            - containerPort: 5000
          resources:
            requests:
              cpu: "200m"
            limits:
              cpu: "400m"
          volumeMounts:
            - name: stress-script
              mountPath: /scripts/stress_server.py
              subPath: stress_server.py
      volumes:
        - name: html-index
          configMap:
            name: lms-html-index
        - name: html-tugas
          configMap:
            name: lms-html-tugas
        - name: css-style
          configMap:
            name: lms-css-style
        - name: nginx-conf
          configMap:
            name: lms-nginx-conf
        - name: nginx-main-conf
          configMap:
            name: lms-nginx-main-conf
        - name: stress-script
          configMap:
            name: lms-stress-script
